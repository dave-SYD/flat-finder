name: Build city data

on:
  workflow_dispatch:
    inputs:
      city:
        description: City id from data/cities.json
        required: true
        default: gwalior

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Magicbricks has a page for this city
        env:
          CITY: ${{ inputs.city }}
        run: |
          SLUG=$(python3 -c "import json,os; print(json.load(open('data/cities.json'))[os.environ['CITY']]['magicbricks'])")
          GURGAON=$(curl -sL -o /dev/null -w "%{http_code}" -A "Mozilla/5.0" "https://www.magicbricks.com/residential-projects-in-gurgaon-nprid/page-1")
          CITYCODE=$(curl -sL -o /dev/null -w "%{http_code}" -A "Mozilla/5.0" "https://www.magicbricks.com/residential-projects-in-${SLUG}-nprid/page-1")
          echo "Gurgaon test page: HTTP $GURGAON"
          echo "$CITY page ($SLUG): HTTP $CITYCODE"
          if [ "$CITYCODE" != "200" ]; then
            echo "STOP: no usable Magicbricks page for $CITY"
            exit 1
          fi

      - name: Build the city
        working-directory: pipeline
        env:
          CITY: ${{ inputs.city }}
        run: |
          python3 mb_crawl.py list "$CITY"
          python3 mb_crawl.py projects "$CITY"
          python3 osm_fetch.py "$CITY"
          python3 build_city.py "$CITY"

      - name: Save the results to the repo
        env:
          CITY: ${{ inputs.city }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/out web/public/data
          git commit -m "Add $CITY data" || echo "Nothing new to commit"
          git push
